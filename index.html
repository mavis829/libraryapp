<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>My Library</h1>
    <!-- JS will listen for clicks on this to open the dialog -->
    <button id="new-book-btn" class="btn btn-primary" type="button">+ New Book</button>
  </header>

  <main>
    <!-- JS will empty this and fill it with one card per book in myLibrary -->
    <div id="library" class="library">

      <!-- ------------------------------------------------------------------
           EXAMPLE CARD - hard-coded so you can build your CSS before the JS
           works. This is the shape your JS should generate.
           DELETE THIS once displayBooks() is producing cards.
           ------------------------------------------------------------------ -->
      <div class="book-card" data-id="example-id-1234">
        <h2 class="book-title">The Hobbit</h2>
        <p class="book-author">J.R.R. Tolkien</p>
        <p class="book-pages">295 pages</p>
        <p class="book-status not-read">Not read yet</p>
        <div class="card-actions">
          <button class="btn btn-toggle" type="button">Mark as read</button>
          <button class="btn btn-remove" type="button">Remove</button>
        </div>
      </div>
      <!-- ---------------------- END EXAMPLE CARD ------------------------- -->

    </div>
  </main>

  <!-- The form lives in a <dialog>. Open it with .showModal(), close with .close() -->
  <dialog id="book-dialog">
    <form id="book-form" method="dialog">
      <h2>Add a book</h2>

      <label for="title">Title</label>
      <input type="text" id="title" name="title" required>

      <label for="author">Author</label>
      <input type="text" id="author" name="author" required>

      <label for="pages">Pages</label>
      <input type="number" id="pages" name="pages" min="1" required>

      <div class="checkbox-row">
        <input type="checkbox" id="read" name="read">
        <label for="read">I've read it</label>
      </div>

      <div class="form-actions">
        <button type="button" id="cancel-btn" class="btn">Cancel</button>
        <button type="submit" id="submit-btn" class="btn btn-primary">Add book</button>
      </div>
    </form>
  </dialog>

  <script src="script.js" defer></script>
</body>
</html>
